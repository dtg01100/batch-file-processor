[build-system]
requires = [
    "setuptools>=64.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "batch-file-processor"
version = "0.0.0"
description = "Batch file processor with EDI support"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8.0,<6.11",
    "SQLAlchemy>=1.4.49",
    "Jinja2>=3.1.6",
    "Mako>=1.3.12",
    "MarkupSafe>=2.1.3",
    "Pillow>=10.3.0",
    "appdirs>=1.4.4",
    "attrs>=21.4.0",
    "chardet>=5.0.0",
    "charset-normalizer>=3.2.0",
    "cssselect>=1.2.0",
    "cssutils>=2.7.1",
    "et-xmlfile>=1.1.0",
    "greenlet>=3.0.1",
    "jdcal>=1.4.1",
    "lxml>=6.1.0",
    "openpyxl>=3.0.9",
    "packaging>=23.2",
    "paramiko>=3.0.0",
    "pathspec>=0.9.0",
    "pbr>=5.9.0",
    "platformdirs>=2.5.2",
    "premailer>=3.10.0",
    "python-barcode>=0.15.1",
    "python-dateutil>=2.8.2",
    "python-editor>=1.0.4",
    "pytz>=2023.3.post1",
    "rapidfuzz>=2.13.6",
    "requests>=2.32.2",
    "thefuzz>=0.19.0",
    "tqdm>=4.64.0",
    "typing_extensions>=4.2.0",
    "tzdata>=2023.3",
    "urllib3>=2.7.0",
    "validate-email>=1.3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov==4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.100.0",
    "pyzbar",
    "mypy>=1.10.0",
    "isort==5.12.0",
]
build = [
    "pyinstaller>=6.0.0",
    "pyinstaller-hooks-contrib>=2024.0",
    "nuitka>=2.4",
    "ordered-set>=4.1",
    "patchelf>=0.17",
]

[tool.setuptools.packages.find]
include = [
    "backend*",
    "core*",
    "dispatch*",
    "interface*",
    "scripts*",
    "adapters*",
]

# Per-project configuration for the nuitka-wine-builder image
# (../nuitka-wine-builder). The CLI reads this table when
# ``--src-dir`` is given; CLI flags always override. Drop or
# change these values to point the builder at a different entry
# point or to add / remove bundled packages. See
# ../nuitka-wine-builder/README.md for the full schema.
[tool.nuitka-wine-build]
entry_point = "main_interface.py"
output_filename = "Batch File Sender.exe"
company_name = "Capital Candy"
product_name = "Batch File Sender"
file_version = "1.0.0"
product_version = "1.0.0"
include_packages = [
    "dispatch",
    "dispatch.converters",
    "dispatch.pipeline",
    "interface",
    "interface.qt",
    "interface.qt.dialogs",
    "interface.qt.dialogs.edit_folders",
    "interface.qt.services",
    "interface.qt.widgets",
    "interface.form",
    "interface.operations",
    "interface.plugins",
    "interface.services",
    "core",
    "core.edi",
    "backend",
    "adapters",
    "adapters.sqlite",
    "adapters.sqlite.repositories",
    "adapters.inmemory",
    "adapters.inmemory.repositories",
    "adapters.db2ssh",
    "migrations",
    "scripts.backup_increment",
    "scripts.batch_log_sender",
    "scripts.create_database",
    # Third-party deps that Nuitka's static import-walk can't reach from
    # main_interface.py but are pulled in by reachable modules. Adding
    # these here is the difference between "Nuitka reports success" and
    # "the .exe actually boots." Each one is in pyproject.toml deps.
    # See audit log: dispatch/converters/* uses openpyxl+PIL+barcode via
    # dynamic pkgutil discovery, scripts/mover.py uses PyQt5 (legacy).
    # (pydantic/pydantic_core/typing_inspection were removed 2026-07-31
    # when the project dropped its pydantic dependency; they are no
    # longer pulled in by any reachable module.)
    # `scripts/` package was narrowed from a single `--include-package=scripts`
    # to four module-level includes 2026-08-03: only those 4 modules
    # are reachable from the entrypoint. Dev-only scripts (PyQt5,
    # pytest, CLI tools) no longer get bundled — drops cold-build
    # work, removes an anti-bloat warning, and shrinks the .exe.
    "openpyxl",
    "PIL",
    "barcode",
    "dateutil",
    "paramiko",
]
include_modules = [
    "appdirs",
    "lxml._elementpath",
    "thefuzz.process",
    "rapidfuzz.process",
    # python-barcode lazy-loads these; without explicit includes the .exe
    # crashes the first time a barcode is rendered. Source: audit of
    # python_barcode.writer — all SVG/PNG backends are imported on demand.
    "barcode.writer",
    "barcode.codex",
]
include_data_dirs = [["edi_formats", "edi_formats"]]
enable_plugins = ["pyside6"]
jobs = 4
[tool.black]
line-length = 88
target-version = [
    "py313",
]

[tool.isort]
profile = "black"
py_version = "313"

[tool.ruff]
line-length = 88
target-version = "py313"
# Exclude vendored production code shipped as test fixtures (1.47 parity
# harness). These files are imported via sys.modules injection and are not
# project source. Linting them duplicates work done at their source repo
# and yields noise unrelated to this project's code health.
extend-exclude = [
    "tests/fixtures/legacy_147",
]
[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "C90",
    "B",
    "FBT",
    "SIM",
    "RET",
    "ARG",
    "RUF",
    "UP",
    "G",
]
ignore = [
    "E203",
    "B028",
    "SIM117",
    "RET504",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
