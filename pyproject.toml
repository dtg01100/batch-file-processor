[tool.mypy]
python_version = "3.13"
strict = false
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "archive.*",
    "scripts.*",
    "tests.*",
    "migrations.*",
    "adapters.sqlite.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "appdirs",
    "barcode.*",
    "barcode",
    "openpyxl.*",
    "PySide6",
    "PySide6.*",
    "shiboken6",
]
ignore_missing_imports = true
