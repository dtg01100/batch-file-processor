[build-system]
requires = [
    "setuptools>=64.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "batch-file-processor"
version = "0.0.0"
description = "Batch file processor with EDI support"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=1.4.49",
    "Jinja2>=3.1.6",
    "Mako>=1.3.12",
    "MarkupSafe>=2.1.3",
    "Pillow>=10.3.0",
    "appdirs>=1.4.4",
    "attrs>=21.4.0",
    "chardet>=5.0.0",
    "charset-normalizer>=3.2.0",
    "cssselect>=1.2.0",
    "cssutils>=2.7.1",
    "et-xmlfile>=1.1.0",
    "greenlet>=3.0.1",
    "jdcal>=1.4.1",
    "lxml>=6.1.0",
    "openpyxl>=3.0.9",
    "packaging>=23.2",
    "paramiko>=3.0.0",
    "pathspec>=0.9.0",
    "pbr>=5.9.0",
    "platformdirs>=2.5.2",
    "premailer>=3.10.0",
    "python-barcode>=0.15.1",
    "python-dateutil>=2.8.2",
    "python-editor>=1.0.4",
    "pytz>=2023.3.post1",
    "rapidfuzz>=2.13.6",
    "requests>=2.32.2",
    "thefuzz>=0.19.0",
    "tqdm>=4.64.0",
    "typing_extensions>=4.2.0",
    "tzdata>=2023.3",
    "urllib3>=2.7.0",
    "validate-email>=1.3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov==4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.100.0",
    "pyzbar",
    "mypy>=1.10.0",
    "isort==5.12.0",
]

[tool.setuptools.packages.find]
include = [
    "backend*",
    "core*",
    "dispatch*",
    "interface*",
    "scripts*",
    "adapters*",
    "webapp*",
]

[tool.black]
line-length = 88
target-version = [
    "py313",
]

[tool.isort]
profile = "black"
py_version = "313"

[tool.ruff]
line-length = 88
target-version = "py313"
# Exclude vendored production code shipped as test fixtures (1.47 parity
# harness). These files are imported via sys.modules injection and are not
# project source. Linting them duplicates work done at their source repo
# and yields noise unrelated to this project's code health.
extend-exclude = [
    "tests/fixtures/legacy_147",
]
[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "C90",
    "B",
    "FBT",
    "SIM",
    "RET",
    "ARG",
    "RUF",
    "UP",
    "G",
]
ignore = [
    "E203",
    "B028",
    "SIM117",
    "RET504",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"archive/*" = [
    "E402",
    "E501",
    "F841",
    "C90",
    "ANN",
    "UP006",
    "UP045",
    "FBT",
    "D413",
    "ARG",
    "PLR2004",
    "PLC0415",
    "SIM117",
]
# FastAPI's Depends() injection pattern uses function calls in argument
# defaults, which ruff's B008 ("function call in argument defaults")
# flags correctly for plain Python but is a known false-positive for
# FastAPI: Depends() returns a sentinel marker that the framework
# inspects, not a real value. Every endpoint in this directory uses
# the dependency-injection style; rewriting 30+ signatures to the
# Annotated[X, Depends(...)] form would be a separate refactor.
"webapp/routers/*" = [
    "B008",
]
"adapters/sqlite/repositories/*" = [
    "ANN401",
    "FBT001",
    "FBT002",
    "FBT003",
]
"scripts/*" = [
    "E402",
    "E501",
    "FBT001",
    "FBT002",
    "FBT003",
    "ARG",
    "PLC0415",
    "SIM117",
]
"scripts/self_test.py" = [
    "C90",
]
"scripts/mover.py" = [
    "C90",
]
"tests/*" = [
