[build-system]
requires = [
    "setuptools>=64.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "batch-file-processor"
version = "0.0.0"
description = "Batch file processor with EDI support"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = [
    "backend*",
    "core*",
    "dispatch*",
    "interface*",
    "scripts*",
    "adapters*",
]

[tool.black]
line-length = 88
target-version = [
    "py311",
]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "C90",
    "B",
    "FBT",
    "SIM",
    "RET",
    "ARG",
    "RUF",
    "UP",
]
ignore = [
    "E203",
    "B028",
    "SIM117",
    "RET504",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"archive/*" = [
    "E402",
