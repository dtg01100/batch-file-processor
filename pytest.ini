[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Default: run tests in parallel for speed. -n 2 beats -n auto on this
# test suite because most tests are <100ms and 4 workers' setup overhead
# (~6s each) dominates. Measured: -n auto = 4:03, serial = 3:51,
# -n 2 with -m "not slow" = 1:51 (fast loop). Override with
# PYTEST_XDIST_AUTO_NUM_WORKERS env var when more parallelism helps.
addopts = --tb=short --strict-markers -n 2 --dist loadscope --basetemp=.pytest_temp
# Redirect xdist worker temp dirs and pytest tmp_path to project-space instead
# of /tmp. The user's /tmp has a tight per-user quota (~12.7 MB).
# Keep only failed-test temps to avoid accumulating disk usage.
tmp_path_retention_policy = failed
# xfail_strict: a test marked xfail that unexpectedly passes is reported as a
# failure. Stops silent skip → silent pass rotations when migration paths or
# other "expected to fail" code starts working.
xfail_strict = true
# Note: QT_QPA_PLATFORM=offscreen is set in conftest files for Qt tests
# pytest-timeout applies per test (includes setup/call/teardown because
# timeout_func_only=False by default). Using `signal` on POSIX allows a single
# timed-out test to fail while the rest of the suite continues.
timeout = 120
timeout_method = signal

markers =
    # Test Type Markers
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, filesystem, real components)
    e2e: End-to-end tests (full workflows)
    webapp: Webapp tests (FastAPI API, importer, runner)

    # Speed Markers
    slow: Slow running tests (>30 seconds)
    fast: Fast tests (<5 seconds)

    # Component Markers
    database: Database-related tests
    dispatch: Dispatch/orchestration tests
    conversion: File conversion tests
    backend: Backend tests (FTP, Email, Copy)

    # Workflow Markers
    workflow: Complete workflow tests
    upgrade: Database upgrade tests

    # Test Behavior Markers
    error_recovery: Tests that verify error recovery (exempt from fail-fast)

    # New Test Category Markers (Added March 2026)
    performance: Performance benchmark tests
    security: Security validation tests
    migration: Database migration tests
    plugin: Plugin system tests
    stress: Stress/load tests
    compatibility: Backward compatibility tests
    backward_compatibility: Tests verifying drop-in replacement capability
    edi: EDI file processing tests

    # ODBC Marker
    odbc: Tests that require AS400 ODBC credentials in .env file

    # Property-based testing marker
    property: Property-based tests using Hypothesis

    # Meta-test markers (Phase 1, 2026-07-09)
    meta_hygiene: Meta-test for test-hygiene linter (tests/meta/test_hygiene.py)
    meta_assertions: Meta-test for assertion-mutation runner (tests/meta/test_assertions_are_meaningful.py)
    meta_oracle: Meta-test for property-test oracle consistency (tests/meta/test_property_oracle_consistency.py)
    meta_coverage: Meta-test for production-module test coverage (tests/meta/test_module_coverage.py)
    meta_mutation: Meta-test for source-mutation sufficiency (tests/meta/test_property_tests_are_sufficient.py)
    meta_markers: Meta-test for marker/directory placement (tests/meta/test_marker_placement.py)
    meta_known_equivalents: Meta-test for allowlist integrity (tests/meta/test_known_equivalents.py)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
