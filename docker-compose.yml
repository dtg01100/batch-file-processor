# Batch File Sender — local webapp (webapp-pivot branch).
#
# Runs the FastAPI webapp in Docker. The volume at ./data is the base
# directory (BFS_BASE_DIR=/data inside the container): every configured
# folder's relative path resolves against it. Imported databases and the
# webapp's own folders.db live under /data/config (BFS_DATA_DIR).
#
# Usage:
#   docker compose up --build        # http://localhost:8000
#   docker compose down              # stop (data persists in ./data)
#
# To process real files, drop them under ./data/<relative-path> matching
# the imported folder layout, e.g.:
#   mkdir -p data/incoming
#   cp some_file.edi data/incoming/
services:
  webapp:
    build: .
    container_name: batch-file-sender
    ports:
      - "8000:8000"
    environment:
      BFS_BASE_DIR: /data
      BFS_DATA_DIR: /data/config
    volumes:
      - ./data:/data
    restart: unless-stopped
