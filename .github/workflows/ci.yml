name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy backend core dispatch interface webapp || true
      - name: Format check (black)
        run: black --check .
      - name: Run tests
        # The full non-meta suite (unit + integration). The meta-tests
        # (tests/meta) are their own suite and are excluded here; run them
        # locally with `make test-meta`. Integration tests are included.
        run: pytest -n0 -m "not slow" --timeout=120 --ignore=tests/meta
