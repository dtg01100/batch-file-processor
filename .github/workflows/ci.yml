name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: npm ci
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy backend core dispatch interface webapp || true
      - name: Format check (black)
        run: black --check .
      - name: Run tests
        # The full non-meta suite (unit + integration). The meta-tests
        # (tests/meta) are their own suite and are excluded here; run them
        # locally with `make test-meta`. Integration tests are included.
        run: pytest -n0 -m "not slow" --timeout=120 --ignore=tests/meta
      - name: Run webapp JS tests
        # The webapp dashboard's fetch helper (static/api.js), pure
        # helpers (static/helpers.js) and row templates
        # (static/templates.js) are tested with node:test; the DOM
        # integration test loads the full dashboard in jsdom.
        run: node --test tests/webapp/api.test.js tests/webapp/helpers.test.js tests/webapp/templates.test.js tests/webapp/dom.test.js
