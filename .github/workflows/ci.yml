name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system libraries (for offscreen PySide6 tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libdbus-1-3 libxcb-cursor0 libxcb-shape0 libxcb-sync1 \
            libfontconfig1 libxkbcommon0 libzbar0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy, interface/qt — non-blocking)
        run: mypy interface/qt || true
      - name: Format check (black)
        run: black --check .
      # Qt tests are excluded here on purpose: the PySide6 pin <6.11 dodges a
      # shiboken binding-manager teardown segfault that flakes under pytest-qt
      # (QThread + signals). The maintained Qt suite runs in the qt-tests job
      # below, so real regressions/crashes stay visible instead of masked.
      - name: Run tests
        run: pytest -n0 -m "not slow and not qt" --timeout=60 --ignore=tests/qt --ignore=tests/unit/interface/qt --ignore=tests/integration --ignore=tests/meta

  # Qt suite: runs the full Qt surface (tests/unit/interface/qt AND tests/qt)
  # because the main job excludes Qt tests. Blocking since 2026-08-09: the
  # two root causes of the historical flakes (an IntEnum-vs-pure-Enum
  # comparison in resend_dialog.py and a worker thread that was never stored
  # on the dialog and thus never stopped at teardown) are fixed; the suite
  # has been green across repeated combined runs. If flakiness returns, see
  # the binding-manager notes in conftest.py before re-adding
  # continue-on-error.
  qt-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Qt system libraries (for offscreen PySide6 tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libdbus-1-3 libxcb-cursor0 libxcb-shape0 libxcb-sync1 \
            libfontconfig1 libxkbcommon0 libzbar0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      # -n0: the binding-manager segfault also reproduces under pytest-xdist
      # worker teardown, so Qt tests must run single-threaded.
      - name: Run Qt tests (single-threaded)
        run: pytest -n0 tests/unit/interface/qt tests/qt --timeout=120
